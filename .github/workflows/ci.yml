# Typechecks, tests and builds webOS on every push to main and every pull request,
# and uploads the built extension as a downloadable artifact on the run's Summary page.
# Every push to main also replaces the rolling "latest" GitHub Release with a fresh
# webos.zip, always at
#   https://github.com/xGepic/WebOS/releases/latest/download/webos.zip
# To install it, unzip it and load the folder unpacked (brave://extensions,
# Developer mode, Load unpacked).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the extension
        uses: actions/upload-artifact@v5
        with:
          name: webos-${{ github.sha }}
          path: dist/webos/browser/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the latest Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: webos-${{ github.sha }}
          path: webos

      - name: Zip the extension
        run: cd webos && zip -r ../webos.zip .

      # Deletes the previous "latest" Release and its tag, then recreates both on this commit.
      - name: Replace the latest Release
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest webos.zip \
            --target "$GITHUB_SHA" \
            --title "webOS (latest)" \
            --latest \
            --notes "Built from ${GITHUB_SHA::7} on main. Unzip webos.zip and load the folder unpacked (brave://extensions, Developer mode, Load unpacked)."
