# Typechecks, tests and builds webOS on every push to main and every pull request,
# and uploads the built extension as a downloadable artifact. To install it, download
# the artifact from the run's Summary page, unzip it, and load the folder unpacked
# (brave://extensions, Developer mode, Load unpacked).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the extension
        uses: actions/upload-artifact@v5
        with:
          name: webos-${{ github.sha }}
          path: dist/webos/browser/
          if-no-files-found: error
          retention-days: 30
